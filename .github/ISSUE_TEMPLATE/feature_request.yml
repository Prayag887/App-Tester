name: Feature request
description: Propose a user-facing improvement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: privacy
    attributes:
      label: Privacy and device impact
      description: Explain any traffic, certificate, proxy, VPN, or device-permission impact.
