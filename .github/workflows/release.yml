name: Release Windows and Linux

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      companion_apk_url:
        description: Optional direct URL to a locally built companion APK release asset (defaults to the APK from the latest release, falling back to v0.2.4's asset).
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate-version:
    name: Validate release version
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Ensure version and release are new
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$(jq -r .version apps/desktop/src-tauri/tauri.conf.json)"
          TAG="v${VERSION}"
          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${GITHUB_REF_NAME}" != "${TAG}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match app version ${TAG}."
            exit 1
          fi
          if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; bump the app version before releasing."
            exit 1
          fi

  desktop:
    name: Desktop (${{ matrix.name }})
    needs: validate-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            platform: windows-latest
            args: --bundles nsis
            assetNamePattern: App_Tester_[version]_Windows.[ext]
          - name: Linux
            platform: ubuntu-22.04
            args: --bundles appimage,deb
            assetNamePattern: App_Tester_[version]_Linux.[ext]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux webview dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Resolve locally built companion APK
        shell: bash
        run: |
          mkdir -p apps/companion/releases
          if [ -n "${{ inputs.companion_apk_url }}" ]; then
            echo "Using provided APK URL"
            curl --fail --location --retry 3 "${{ inputs.companion_apk_url }}" \
              --output apps/companion/releases/app-tester-companion.apk
          else
            echo "No APK URL provided; trying the latest release asset"
            curl --fail --location --retry 3 \
              "https://github.com/Prayag887/App-Tester/releases/latest/download/app-tester-companion.apk" \
              --output apps/companion/releases/app-tester-companion.apk \
              || { echo "Latest release has no APK yet; falling back to v0.2.4 asset"; \
                   curl --fail --location --retry 3 \
                   "https://github.com/Prayag887/App-Tester/releases/download/v0.2.4/app-tester-companion.apk" \
                   --output apps/companion/releases/app-tester-companion.apk; }
          fi
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          tagName: v__VERSION__
          releaseName: App Tester v__VERSION__
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: true
          args: ${{ matrix.args }}
          retryAttempts: 2
          releaseAssetNamePattern: ${{ matrix.assetNamePattern }}
          updaterJsonPreferNsis: true
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
