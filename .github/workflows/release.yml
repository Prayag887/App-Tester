name: Release Windows and Linux

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate-version:
    name: Validate release version
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Ensure version and release are new
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$(jq -r .version apps/desktop/src-tauri/tauri.conf.json)"
          TAG="v${VERSION}"
          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${GITHUB_REF_NAME}" != "${TAG}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match app version ${TAG}."
            exit 1
          fi
          if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; bump the app version before releasing."
            exit 1
          fi

  companion:
    name: Companion APK
    needs: validate-version
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build current Companion release
        run: |
          cd apps/companion
          flutter build apk --release --split-per-abi
          node ../../scripts/sync-companion-release.mjs app-arm64-v8a-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: companion-apk
          path: apps/companion/releases/app-tester-companion.apk
          if-no-files-found: error

  desktop:
    name: Desktop (${{ matrix.name }})
    needs: [validate-version, companion]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            platform: windows-latest
            args: --bundles nsis
            assetNamePattern: App_Tester_[version]_Windows.[ext]
          - name: Linux
            platform: ubuntu-22.04
            args: --bundles appimage,deb
            assetNamePattern: App_Tester_[version]_Linux.[ext]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 11.5.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux webview dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: actions/download-artifact@v4
        with:
          name: companion-apk
          path: apps/companion/releases
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          tagName: v__VERSION__
          releaseName: App Tester v__VERSION__
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: true
          args: ${{ matrix.args }}
          retryAttempts: 2
          releaseAssetNamePattern: ${{ matrix.assetNamePattern }}
          updaterJsonPreferNsis: true
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true

  publish-companion:
    name: Publish Companion APK
    needs: [validate-version, companion, desktop]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: companion-apk
          path: release-assets
      - name: Attach Companion APK to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$(jq -r .version apps/desktop/src-tauri/tauri.conf.json)"
          gh release upload "v${VERSION}" release-assets/app-tester-companion.apk --clobber
