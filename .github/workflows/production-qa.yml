name: Production QA

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: production-qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-qa:
    name: Production QA
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Configure Android NDK
        run: |
          android_sdk_root="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          "$android_sdk_root/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.0.12077973"
          echo "ANDROID_NDK_HOME=$android_sdk_root/ndk/27.0.12077973" >> "$GITHUB_ENV"
      - name: Install Linux desktop build dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: pnpm install --frozen-lockfile
      - run: pnpm qa:production
