name: Desktop Bundles

on:
  workflow_dispatch:
    inputs:
      companion_apk_url:
        description: Direct URL to the locally built companion APK release asset.
        required: true
        type: string

permissions:
  contents: read

jobs:
  desktop:
    name: Desktop (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            artifacts: apps/desktop/src-tauri/target/release/bundle/nsis/*
          - name: Linux
            os: ubuntu-22.04
            artifacts: |
              apps/desktop/src-tauri/target/release/bundle/appimage/*
              apps/desktop/src-tauri/target/release/bundle/deb/*
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux webview dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Download locally built companion APK
        shell: bash
        run: |
          mkdir -p apps/companion/releases
          curl --fail --location --retry 3 "${{ inputs.companion_apk_url }}" --output apps/companion/releases/app-tester-companion.apk
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/desktop tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: app-tester-${{ matrix.name }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
