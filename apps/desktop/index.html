<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#09100f" />
    <title>App Tester</title>
    <script src="/startup-theme.js"></script>
    <style>
      html,body{margin:0;min-height:100%;background:var(--splash-bg);color:var(--splash-text)}
      #startup-splash{position:fixed;z-index:9999;inset:0;display:grid;place-items:center;overflow:hidden;background:var(--splash-bg);font-family:Inter,ui-sans-serif,system-ui,sans-serif;transition:opacity 420ms ease,transform 520ms cubic-bezier(.16,1,.3,1);transform-origin:center}
      #startup-splash::before{position:absolute;width:360px;height:360px;border-radius:48% 52% 61% 39%/42% 45% 55% 58%;content:"";background:color-mix(in srgb,var(--splash-accent) 13%,transparent);filter:blur(2px);animation:splash-orbit 2.8s ease-in-out infinite alternate}
      #startup-splash.leaving{opacity:0;transform:scale(1.035);pointer-events:none}
      .splash-mark{position:relative;display:grid;justify-items:center;gap:13px}
      .splash-logo{display:grid;width:54px;height:54px;place-items:center;border:1px solid color-mix(in srgb,var(--splash-accent) 55%,transparent);border-radius:16px;color:var(--splash-accent);background:color-mix(in srgb,var(--splash-accent) 12%,var(--splash-bg));box-shadow:0 16px 45px color-mix(in srgb,var(--splash-accent) 24%,transparent);animation:splash-breathe 1.7s ease-in-out infinite}
      .splash-logo svg{width:29px;height:29px}.splash-mark b{font-size:17px;letter-spacing:-.02em}.splash-mark span{color:color-mix(in srgb,var(--splash-text) 62%,transparent);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
      .splash-dots{display:flex;gap:5px;margin-top:2px}.splash-dots i{width:5px;height:5px;border-radius:50%;background:var(--splash-accent);animation:splash-dot 1s ease-in-out infinite}.splash-dots i:nth-child(2){animation-delay:120ms}.splash-dots i:nth-child(3){animation-delay:240ms}
      @keyframes splash-breathe{50%{transform:translateY(-4px) scale(1.035);box-shadow:0 20px 55px color-mix(in srgb,var(--splash-accent) 32%,transparent)}}
      @keyframes splash-orbit{to{transform:rotate(14deg) scale(1.12);border-radius:58% 42% 38% 62%/49% 62% 38% 51%}}
      @keyframes splash-dot{0%,100%{opacity:.28;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}
      @media(prefers-reduced-motion:reduce){#startup-splash,.splash-logo,.splash-dots i,#startup-splash::before{animation:none;transition-duration:1ms}}
    </style>
  </head>
  <body>
    <div id="startup-splash" role="status" aria-label="Starting App Tester">
      <div class="splash-mark">
        <div class="splash-logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12h4l2-7 4 14 2-7h6"/><rect x="2" y="2" width="20" height="20" rx="6"/></svg></div>
        <b>App Tester</b><span>Preparing your workspace</span>
        <div class="splash-dots" aria-hidden="true"><i></i><i></i><i></i></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
